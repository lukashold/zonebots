<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zonebots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  :root {
    --bg: #0d0f12; --steel: #4a5059; --steel-hi: #7b838e; --steel-lo: #23272d; --well: #101317;
    --text: #e9e4d2; --dim: #9aa39c; --accent: #ffd23a; --red: #d23b2a; --blue: #2f62d6; --green: #3ed43e;
    --font: "VT323", "Lucida Console", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 20px/1.1 var(--font); user-select: none; -webkit-user-select: none; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; touch-action: none; }
  .hidden { display: none !important; }

  /* bevelled steel, like riveted plates */
  .steel { background: linear-gradient(180deg, #5a616b 0%, #454b54 45%, #3a3f47 100%); border: 2px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi); box-shadow: inset 0 0 0 1px #000; }
  .well { background: var(--well); border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo); }
  button { font: inherit; font-size: 20px; color: var(--text); background: linear-gradient(180deg, #6a727d, #4b525b); border: 2px solid; border-color: #9aa3ae #22262b #22262b #9aa3ae; padding: 2px 10px; cursor: pointer; text-shadow: 1px 1px 0 #000; }
  button:hover:not(:disabled) { background: linear-gradient(180deg, #7d8692, #59616b); }
  button:active:not(:disabled) { border-color: #22262b #9aa3ae #9aa3ae #22262b; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: linear-gradient(180deg, #ffe066, #d9a920); color: #1b1b1b; text-shadow: none; border-color: #fff2a8 #7a5d0a #7a5d0a #fff2a8; }
  button.on { background: linear-gradient(180deg, #3a3416, #57491a); border-color: #22262b #ffd23a #ffd23a #22262b; color: var(--accent); }

  /* ---------- bottom command bar ---------- */
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 132px; display: flex; gap: 8px; padding: 8px; align-items: stretch; }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; top: -4px; height: 4px; background: repeating-linear-gradient(90deg, #ffd23a 0 12px, #1a1a1a 12px 24px); }
  #miniWrap { flex: none; padding: 3px; display: flex; align-items: center; justify-content: center; }
  #mini { display: block; cursor: crosshair; }
  #sel { flex: none; width: 290px; display: flex; gap: 8px; padding: 6px; }
  #portrait { flex: none; width: 96px; height: 96px; background: #1b2620; border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo); }
  #info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  #infoName { color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #infoSub { color: var(--dim); font-size: 18px; line-height: 1; }
  .hp { height: 8px; background: #000; border: 1px solid #000; }
  .hp i { display: block; height: 100%; background: var(--green); }
  #cmd { flex: 1; min-width: 0; padding: 6px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  #cmdTitle { color: var(--dim); font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #prods { display: flex; flex-wrap: wrap; gap: 4px; }
  .prod { width: 54px; height: 54px; padding: 0; position: relative; }
  .prod canvas { width: 50px; height: 50px; display: block; }
  .prod b { position: absolute; right: 2px; bottom: 0; font-weight: normal; font-size: 16px; color: var(--accent); }
  #pbar { height: 6px; background: #000; margin-top: auto; }
  #pbar i { display: block; height: 100%; width: 0; background: var(--accent); }
  #acts { display: flex; flex-wrap: wrap; gap: 4px; }
  #side { flex: none; width: 168px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  #terr { display: flex; height: 16px; border: 2px solid #000; background: #2a2a2a; }
  #terr i { display: block; height: 100%; transition: width 0.4s; }
  #terrR { background: var(--red); } #terrN { flex: 1; } #terrB { background: var(--blue); }
  #sideRow { display: flex; justify-content: space-between; align-items: center; color: var(--dim); }
  #clock { color: var(--text); }
  #sideBtns { display: flex; gap: 4px; margin-top: auto; }
  #sideBtns button { flex: 1; padding: 2px 0; }
  #lvTitle { font-size: 18px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #toasts { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
  .toast { background: rgba(10, 12, 14, 0.85); border: 2px solid #000; border-left: 6px solid var(--dim); padding: 2px 12px; animation: fade 3.2s forwards; text-shadow: 1px 1px 0 #000; }
  .toast.good { border-left-color: var(--green); } .toast.bad { border-left-color: var(--red); }
  @keyframes fade { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
  #mode { position: absolute; top: 10px; left: 10px; background: var(--red); padding: 2px 10px; border: 2px solid #000; }

  /* ---------- menus ---------- */
  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 16px;
    background: radial-gradient(ellipse at 50% 35%, #3a2a1a 0%, #120d09 75%); }
  .overlay { background: rgba(5, 6, 8, 0.72); }
  .card { width: min(760px, 100%); padding: 20px 22px; max-height: 100%; overflow: auto; }
  .card.small { width: min(420px, 100%); text-align: center; }
  h1 { margin: 0; font-size: 72px; line-height: 0.9; letter-spacing: 6px; font-weight: normal; text-shadow: 4px 4px 0 #000; }
  h1 b { color: var(--red); font-weight: normal; } h1 i { color: #8fb0ff; font-style: normal; }
  h2 { margin: 0 0 10px; font-size: 40px; font-weight: normal; text-shadow: 3px 3px 0 #000; }
  .tag { color: var(--dim); margin: 2px 0 14px; }
  h4 { margin: 16px 0 8px; font-weight: normal; color: var(--accent); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; letter-spacing: 1px; }
  .world { display: grid; grid-template-columns: 170px repeat(4, 1fr); gap: 6px; align-items: center; margin-bottom: 6px; }
  .world .wn { display: flex; align-items: center; gap: 8px; }
  .world .sw { width: 16px; height: 16px; border: 2px solid #000; flex: none; }
  .lvl { padding: 6px 0; }
  .lvl.done { color: var(--green); }
  .row { display: flex; gap: 8px; margin-top: 14px; justify-content: space-between; flex-wrap: wrap; }
  .center { justify-content: center; }
  #diffBtns, #ctrlBtns { display: flex; gap: 4px; align-items: center; }
  .sk { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sk label { display: flex; flex-direction: column; gap: 2px; color: var(--dim); }
  select, input { font: inherit; color: var(--text); background: var(--well); border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo); padding: 2px 6px; }
  input#skSeed { width: 90px; }
  label.btn { font: inherit; color: var(--text); background: linear-gradient(180deg, #6a727d, #4b525b); border: 2px solid; border-color: #9aa3ae #22262b #22262b #9aa3ae; padding: 2px 10px; cursor: pointer; text-shadow: 1px 1px 0 #000; }
  label.btn:hover { background: linear-gradient(180deg, #7d8692, #59616b); }
  #zBtns { display: flex; gap: 4px; align-items: center; }
  .zl { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; }
  .zl button { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #helpBody p { margin: 0 0 10px; color: #d8d3c2; user-select: text; }
  #helpBody b { color: var(--accent); font-weight: normal; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; margin: 12px auto; width: fit-content; text-align: left; color: var(--dim); }
  .stats b { color: var(--text); text-align: right; font-weight: normal; }
  #endBest { color: var(--accent); min-height: 22px; }
  @media (max-width: 900px) { #sel { width: 210px; } #portrait { width: 72px; height: 72px; } #side { width: 128px; } }
  @media (max-width: 640px) { #miniWrap { display: none; } .world { grid-template-columns: repeat(4, 1fr); } .world .wn { grid-column: 1 / -1; } h1 { font-size: 52px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="toasts"></div>
  <div id="mode" class="hidden"></div>
  <div id="bar" class="steel">
    <div id="miniWrap" class="well"><canvas id="mini"></canvas></div>
    <div id="sel" class="well">
      <canvas id="portrait" width="48" height="48"></canvas>
      <div id="info">
        <div id="infoName"></div>
        <div class="hp" id="infoHp"><i></i></div>
        <div id="infoSub"></div>
      </div>
    </div>
    <div id="cmd" class="well">
      <div id="cmdTitle"></div>
      <div id="prods"></div>
      <div id="acts"></div>
      <div id="pbar" class="hidden"><i></i></div>
    </div>
    <div id="side" class="well">
      <div id="lvTitle"></div>
      <div id="terr"><i id="terrR"></i><i id="terrN"></i><i id="terrB"></i></div>
      <div id="sideRow"><span id="terrTxt"></span><span id="clock">0:00</span></div>
      <div id="sideBtns"><button id="btnMenu" title="Menü">☰</button><button id="btnSpeed">1×</button><button id="btnSound">♪</button></div>
    </div>
  </div>
</div>

<div id="menu" class="screen">
  <div class="card steel">
    <h1><b>ZONE</b><i>BOTS</i></h1>
    <div class="tag" id="tagline"></div>
    <h4><span id="campTitle"></span><span id="diffBtns"></span></h4>
    <span id="diffLabel" class="hidden"></span>
    <div id="worlds"></div>
    <h4><span id="skTitle"></span></h4>
    <div class="sk">
      <label><span></span><select id="skSize"></select></label>
      <label><span></span><select id="skWorld"></select></label>
      <label><span></span><select id="skTech"></select></label>
      <label><span></span><input id="skSeed" type="number" min="1" max="999999"></label>
      <button id="btnSeed" title="Random">⚄</button>
      <button id="btnSkirmish" class="primary"></button>
    </div>
    <h4><span id="zTitle"></span><span id="zBtns"><label class="btn" id="zPickLabel"><input type="file" id="zPick" webkitdirectory directory multiple hidden><span id="zPickText"></span></label><button id="zForget" class="hidden"></button></span></h4>
    <div id="zHint" class="tag"></div>
    <div id="zLevels" class="zl"></div>
    <h4><span id="ctrlTitle"></span><span id="ctrlBtns"></span></h4>
    <div class="row">
      <button id="btnHelp"></button>
      <button id="btnLang"></button>
    </div>
  </div>
</div>

<div id="help" class="screen overlay hidden">
  <div class="card steel">
    <h2 id="helpTitle"></h2>
    <div id="helpBody"></div>
    <div class="row center"><button class="primary" id="btnHelpBack"></button></div>
  </div>
</div>

<div id="pause" class="screen overlay hidden">
  <div class="card small steel">
    <h2 id="pauseTitle"></h2>
    <div class="row center">
      <button class="primary" id="btnResume"></button>
      <button id="btnRestart"></button>
      <button id="btnPauseHelp"></button>
      <button id="btnQuit"></button>
    </div>
  </div>
</div>

<div id="end" class="screen overlay hidden">
  <div class="card small steel">
    <h2 id="endTitle"></h2>
    <div id="endSub" class="tag"></div>
    <div class="stats" id="endStats"></div>
    <div id="endBest"></div>
    <div class="row center">
      <button class="primary" id="btnNext"></button>
      <button id="btnRetry"></button>
      <button id="btnEndMenu"></button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/zdata.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
