<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zonebots</title>
<style>
  :root { --bg: #14171c; --panel: rgba(22, 26, 32, 0.92); --line: #39424f; --text: #e8ecf1; --dim: #97a3b3; --accent: #ffd94a; --red: #d8362f; --blue: #2f6fd8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; touch-action: none; }
  button { font: inherit; color: var(--text); background: #2a313b; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: #364050; border-color: #5a6779; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--accent); color: #1b1b1b; border-color: #b89a22; font-weight: 600; }
  button.primary:hover { background: #ffe57a; }
  .hidden { display: none !important; }

  #top { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #top .title { font-weight: 600; white-space: nowrap; }
  #terr { flex: 1; height: 14px; min-width: 80px; background: #555a61; border-radius: 7px; overflow: hidden; display: flex; justify-content: space-between; border: 1px solid #000; }
  #terr i { display: block; height: 100%; transition: width 0.4s; }
  #terrR { background: var(--red); } #terrB { background: var(--blue); }
  #clock { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 44px; text-align: right; }
  #top button { padding: 3px 10px; }

  #mini { position: absolute; left: 10px; bottom: 10px; border: 2px solid var(--line); border-radius: 4px; background: #000; cursor: crosshair; }
  #panel { position: absolute; right: 10px; bottom: 10px; width: 300px; max-width: calc(100vw - 260px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  #panel h3 { margin: 0 0 2px; font-size: 14px; display: flex; justify-content: space-between; }
  #panel .sub { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  #prods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .prod { padding: 2px; display: flex; flex-direction: column; align-items: center; font-size: 10px; line-height: 1.15; color: var(--dim); text-align: center; min-height: 68px; }
  .prod canvas { width: 44px; height: 44px; }
  .prod.on { border-color: var(--accent); background: #3d3a22; color: var(--text); }
  #pbar { height: 6px; background: #000; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  #pbar i { display: block; height: 100%; width: 0; background: var(--accent); }
  #selinfo { display: flex; flex-wrap: wrap; gap: 6px; }
  #selinfo span { background: #2a313b; border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; font-size: 12px; }

  #actions { position: absolute; top: 48px; left: 10px; display: flex; gap: 6px; }
  #actions button { padding: 4px 10px; background: var(--panel); font-size: 12px; }
  h4 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  #diffBtns { display: flex; gap: 6px; align-items: center; text-transform: none; letter-spacing: 0; }
  #diffBtns button { padding: 3px 10px; }
  .sk { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sk label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--dim); }
  select, input { font: inherit; color: var(--text); background: #2a313b; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  input#skSeed { width: 84px; }
  #endBest { color: var(--accent); min-height: 20px; }
  #toasts { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
  .toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--dim); border-radius: 5px; padding: 4px 12px; font-size: 13px; animation: fade 3.2s forwards; }
  .toast.good { border-left-color: #4bd04b; } .toast.bad { border-left-color: var(--red); }
  @keyframes fade { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
  #mode { position: absolute; top: 84px; left: 10px; background: var(--red); padding: 3px 10px; border-radius: 5px; font-size: 12px; }

  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 30%, #2b3644 0%, #14171c 70%); overflow: auto; padding: 16px; }
  .overlay { background: rgba(10, 12, 16, 0.72); }
  .card { width: min(720px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; max-height: 100%; overflow: auto; }
  .card.small { width: min(380px, 100%); text-align: center; }
  h1 { margin: 0; font-size: 44px; letter-spacing: 6px; text-wrap: balance; }
  h1 b { color: var(--red); } h1 i { color: var(--blue); font-style: normal; }
  h2 { margin: 0 0 12px; font-size: 26px; }
  .tag { color: var(--dim); margin: 2px 0 18px; }
  .world { display: grid; grid-template-columns: 150px repeat(4, 1fr); gap: 8px; align-items: center; margin-bottom: 8px; }
  .world .wn { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .world .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #000; flex: none; }
  .lvl { padding: 10px 0; font-weight: 600; }
  .lvl.done { border-color: #4bd04b; }
  .row { display: flex; gap: 8px; margin-top: 16px; justify-content: space-between; flex-wrap: wrap; }
  .center { justify-content: center; }
  #helpBody p { margin: 0 0 10px; color: #cfd6df; user-select: text; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; margin: 14px auto; width: fit-content; text-align: left; color: var(--dim); }
  .stats b { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) { .world { grid-template-columns: repeat(4, 1fr); } .world .wn { grid-column: 1 / -1; } h1 { font-size: 32px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="top">
    <button id="btnMenu">☰</button>
    <span class="title" id="lvTitle"></span>
    <div id="terr"><i id="terrR"></i><i id="terrB"></i></div>
    <span id="terrTxt"></span>
    <span id="clock">0:00</span>
    <button id="btnSpeed">1×</button>
    <button id="btnSound">♪</button>
  </div>
  <div id="actions"><button id="actAll"></button><button id="actNone"></button><button id="actStop"></button><button id="actAtk"></button></div>
  <div id="toasts"></div>
  <div id="mode" class="hidden"></div>
  <canvas id="mini"></canvas>
  <div id="panel" class="hidden">
    <div id="bldInfo">
      <h3><span id="bName"></span><span id="bTech"></span></h3>
      <div class="sub" id="bSub"></div>
      <div id="prods"></div>
      <div id="pbar"><i></i></div>
    </div>
    <div id="selinfo"></div>
  </div>
</div>

<div id="menu" class="screen">
  <div class="card">
    <h1><b>ZONE</b><i>BOTS</i></h1>
    <div class="tag" id="tagline"></div>
    <h4><span id="campTitle"></span><span id="diffBtns"></span></h4>
    <span id="diffLabel" class="hidden"></span>
    <div id="worlds"></div>
    <h4><span id="skTitle"></span></h4>
    <div class="sk">
      <label><span></span><select id="skSize"></select></label>
      <label><span></span><select id="skWorld"></select></label>
      <label><span></span><select id="skTech"></select></label>
      <label><span></span><input id="skSeed" type="number" min="1" max="999999"></label>
      <button id="btnSeed" title="Random">🎲</button>
      <button id="btnSkirmish" class="primary"></button>
    </div>
    <div class="row">
      <button id="btnHelp"></button>
      <button id="btnLang"></button>
    </div>
  </div>
</div>

<div id="help" class="screen overlay hidden">
  <div class="card">
    <h2 id="helpTitle"></h2>
    <div id="helpBody"></div>
    <div class="row center"><button class="primary" id="btnHelpBack"></button></div>
  </div>
</div>

<div id="pause" class="screen overlay hidden">
  <div class="card small">
    <h2 id="pauseTitle"></h2>
    <div class="row center">
      <button class="primary" id="btnResume"></button>
      <button id="btnRestart"></button>
      <button id="btnPauseHelp"></button>
      <button id="btnQuit"></button>
    </div>
  </div>
</div>

<div id="end" class="screen overlay hidden">
  <div class="card small">
    <h2 id="endTitle"></h2>
    <div id="endSub" class="tag"></div>
    <div class="stats" id="endStats"></div>
    <div id="endBest"></div>
    <div class="row center">
      <button class="primary" id="btnNext"></button>
      <button id="btnRetry"></button>
      <button id="btnEndMenu"></button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
