[package]
name = "zonebots-rust"
version = "0.3.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "z-sim"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
